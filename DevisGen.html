<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Générateur de devis PDF</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff;--panel:#fff;--ink:#1b2438;--mute:#667088;--line:#dcdfe5;--accent:#0f6b5c;--accent-ink:#fff;--danger:#b3322b;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Source Sans 3",system-ui,sans-serif}
main{max-width:1320px;margin:0 auto;padding:24px 16px 64px}
h1{font:700 2rem/1.1 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 4px}
h2{font:600 1.1rem "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 12px}
.sub{color:var(--mute);margin:0 0 24px}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
label{display:block;font-size:.85rem;color:var(--mute);margin-bottom:4px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:6px;padding:8px 10px}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea{resize:vertical;min-height:64px}
.logo-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
#logoPrev{max-height:56px;max-width:160px;display:none;border:1px solid var(--line);border-radius:6px;padding:4px;background:#fff}
.lines{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th{font-weight:600;font-size:.85rem;color:var(--mute);text-align:left;padding:0 6px 6px}
td{padding:4px 6px 4px 0;vertical-align:top}
td.tot{text-align:right;white-space:nowrap;padding-top:12px;min-width:90px}
.n{width:84px}
button{font:600 1rem "Source Sans 3",system-ui,sans-serif;border-radius:6px;padding:9px 16px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);padding:12px 22px}
button.x{color:var(--danger);padding:6px 10px}
.totals{margin-left:auto;max-width:300px;margin-top:16px}
.totals div{display:flex;justify-content:space-between;padding:3px 0}
.totals .ttc{font-weight:700;font-size:1.2rem;border-top:2px solid var(--ink);margin-top:6px;padding-top:8px}
#msg{margin-left:12px;color:var(--mute)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.pv{position:sticky;top:16px}
.pv h2{margin-bottom:8px}
#pvWrap{width:100%;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#eef0f3}
#sheet{width:794px;min-height:1123px;transform-origin:top left;background:#fff;color:var(--t);padding:57px;display:flex;flex-direction:column;font:13px/1.45 Helvetica,Arial,sans-serif}
#sheet .top{display:flex;justify-content:space-between;gap:20px}
#sheet img{max-height:76px;max-width:226px;display:block;margin-bottom:8px}
#sheet .em{color:#5a5a5a;font-size:11.5px}
#sheet .ti{text-align:right;color:#444;font-size:12.5px}
#sheet .ti b{display:block;font-size:34px;color:var(--c);letter-spacing:.5px;margin-bottom:6px}
#sheet .cl{display:flex;gap:30px;margin:28px 0 24px}
#sheet .cl>div{flex:1}
#sheet table{min-width:0;margin-bottom:6px}
#sheet th{background:var(--c);color:var(--hi);padding:8px;font-size:12px}
#sheet td{padding:8px;border:0;vertical-align:top}
#sheet tbody tr:nth-child(odd) td{background:var(--s)}
#sheet .r{text-align:right;white-space:nowrap}
#sheet .tt{margin-left:auto;width:48%;margin-top:14px}
#sheet .tt div{display:flex;justify-content:space-between;padding:3px 8px}
#sheet .tt .g{font-weight:700;font-size:16px;border-top:2px solid var(--t);margin-top:6px;padding-top:8px}
#sheet .ft{margin-top:auto;padding-top:40px;text-align:center;color:#666;font-size:10.5px}
#sheet .ft div{border-top:1px solid #ccc;padding-top:8px}
input[type=color]{padding:2px;height:38px;cursor:pointer}
@media (max-width:980px){.layout{grid-template-columns:1fr}.pv{position:static}}
</style>
</head>
<body>
<main>
<h1>Générateur de devis</h1>
<p class="sub">Ajoutez votre logo, saisissez les libellés et les prix, puis téléchargez le devis en PDF.</p>
<div class="layout"><div class="form">

<section>
<h2>En-tête et pied de page</h2>
<div class="logo-row">
<div><label for="logo">Logo (PNG, JPG, SVG)</label><input type="file" id="logo" accept="image/*"></div>
<img id="logoPrev" alt="Aperçu du logo">
<span id="logoMsg" role="status" style="color:var(--danger);font-size:.9rem"></span>
</div>
<div class="grid" style="margin-top:12px">
<div><label for="emetteur">Votre entreprise (sous le logo)</label><textarea id="emetteur" placeholder="Nom, adresse, téléphone, e-mail"></textarea></div>
<div><label for="footer">Pied de page</label><textarea id="footer" placeholder="Mentions légales, RCCM / SIRET, IBAN, conditions de paiement"></textarea></div>
</div>
</section>

<section>
<h2>Couleurs du devis</h2>
<div class="grid">
<div><label for="c1">Couleur principale (titre, en-tête du tableau)</label><input type="color" id="c1" value="#0f6b5c"></div>
<div><label for="c2">Lignes alternées du tableau</label><input type="color" id="c2" value="#f4f3ef"></div>
<div><label for="c3">Couleur du texte</label><input type="color" id="c3" value="#1e1e1e"></div>
</div>
</section>

<section>
<h2>Devis</h2>
<div class="grid">
<div><label for="num">Numéro</label><input id="num" value="DEV-001"></div>
<div><label for="date">Date</label><input id="date" type="date"></div>
<div><label for="valid">Validité (jours)</label><input id="valid" type="number" min="0" value="30"></div>
<div><label for="cur">Devise</label><input id="cur" value="€"></div>
</div>
<div class="grid" style="margin-top:12px">
<div><label for="client">Client (nom et adresse)</label><textarea id="client"></textarea></div>
<div><label for="objet">Objet</label><textarea id="objet"></textarea></div>
</div>
</section>

<section>
<h2>Lignes</h2>
<div class="lines">
<table>
<thead><tr><th>Libellé</th><th>Qté</th><th>Prix unitaire</th><th style="text-align:right">Total</th><th></th></tr></thead>
<tbody id="rows"></tbody>
</table>
</div>
<p><button id="add" type="button">Ajouter une ligne</button></p>
<div class="totals">
<div><span>Total HT</span><span id="ht">0</span></div>
<div><span>TVA (<input id="tva" class="n" type="number" min="0" step="0.1" value="0" style="width:64px;padding:2px 6px"> %)</span><span id="tvaAmt">0</span></div>
<div class="ttc"><span>Total TTC</span><span id="ttc">0</span></div>
</div>
</section>

<p><button id="gen" class="primary" type="button">Générer le PDF</button><span id="msg" role="status"></span></p>
</div>
<aside class="pv"><h2>Aperçu</h2><div id="pvWrap"><div id="sheet"></div></div></aside>
</div>
</main>

<script>
const $ = id => document.getElementById(id);
let logo = null; // {data, w, h}
$('date').valueAsDate = new Date();

const fmt = n => (Number(n)||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}).replace(/[\u202f\u00a0]/g,' ');
const cur = () => ($('cur').value || '').trim();
const money = n => fmt(n) + ' ' + cur();

function addRow(l='',q=1,p=''){
  const tr = document.createElement('tr');
  tr.innerHTML = '<td><input class="l" aria-label="Libellé"></td><td><input class="q n" type="number" min="0" step="any" aria-label="Quantité"></td><td><input class="p n" type="number" min="0" step="any" aria-label="Prix unitaire"></td><td class="tot">0</td><td><button class="x" type="button" aria-label="Supprimer la ligne">✕</button></td>';
  tr.querySelector('.l').value = l; tr.querySelector('.q').value = q; tr.querySelector('.p').value = p;
  tr.querySelector('.x').onclick = () => { tr.remove(); calc(); };
  $('rows').appendChild(tr);
}
function getRows(){
  return [...$('rows').children].map(tr => {
    const l = tr.querySelector('.l').value.trim(), q = parseFloat(tr.querySelector('.q').value)||0, p = parseFloat(tr.querySelector('.p').value)||0;
    return {l,q,p,t:q*p};
  }).filter(r => r.l || r.t);
}
function calc(){
  [...$('rows').children].forEach(tr => {
    const t = (parseFloat(tr.querySelector('.q').value)||0)*(parseFloat(tr.querySelector('.p').value)||0);
    tr.querySelector('.tot').textContent = money(t);
  });
  const ht = getRows().reduce((s,r)=>s+r.t,0), tv = ht*(parseFloat($('tva').value)||0)/100;
  $('ht').textContent = money(ht); $('tvaAmt').textContent = money(tv); $('ttc').textContent = money(ht+tv);
  const tot = {ht,tv,ttc:ht+tv}; if($('sheet')) renderPreview(tot); return tot;
}
document.addEventListener('input', calc);
$('add').onclick = () => addRow();

// Logo -> PNG via canvas (works for any image type)
$('logo').onchange = e => {
  const f = e.target.files[0], info = $('logoMsg');
  info.textContent = '';
  if(!f){ logo = null; $('logoPrev').style.display = 'none'; calc(); return; }
  const fr = new FileReader();
  fr.onerror = () => { info.textContent = 'Fichier illisible, essayez un autre logo.'; };
  fr.onload = () => {
    const img = new Image();
    img.onload = () => {
      const iw = img.naturalWidth || img.width || 300, ih = img.naturalHeight || img.height || 100;
      const k = Math.min(1, 800/iw), c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(iw*k)); c.height = Math.max(1, Math.round(ih*k));
      const ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0, c.width, c.height);
      logo = { data: c.toDataURL('image/png'), w: c.width, h: c.height };
      $('logoPrev').src = logo.data; $('logoPrev').style.display = 'block';
      calc();
    };
    img.onerror = () => { logo = null; calc(); info.textContent = 'Image non reconnue. Utilisez un PNG ou un JPG.'; };
    img.src = fr.result;
  };
  fr.readAsDataURL(f);
};

const hex2rgb = h => [1,3,5].map(i => parseInt(h.slice(i,i+2),16));
const lum = h => { const [r,g,b] = hex2rgb(h); return (0.299*r+0.587*g+0.114*b)/255; };
const hiColor = h => lum(h) > 0.62 ? '#1e1e1e' : '#ffffff';
const esc = x => String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nl = x => esc(x).replace(/\n/g,'<br>');
function renderPreview(tot){
  const sh = $('sheet'), c = $('c1').value, rows = getRows(), tva = parseFloat($('tva').value)||0;
  sh.style.setProperty('--c',c); sh.style.setProperty('--s',$('c2').value); sh.style.setProperty('--t',$('c3').value); sh.style.setProperty('--hi',hiColor(c));
  const d = $('date').value ? new Date($('date').value).toLocaleDateString('fr-FR') : '';
  const valid = parseInt($('valid').value) ? '<br>Validité : '+esc($('valid').value)+' jours' : '';
  sh.innerHTML =
   '<div class="top"><div>'+(logo?'<img src="'+logo.data+'" alt="">':'')+'<div class="em">'+nl($('emetteur').value)+'</div></div>'+
   '<div class="ti"><b>DEVIS</b>N° '+esc($('num').value)+'<br>Date : '+esc(d)+valid+'</div></div>'+
   '<div class="cl"><div><b>Client</b><br>'+(nl($('client').value)||'—')+'</div>'+($('objet').value.trim()?'<div><b>Objet</b><br>'+nl($('objet').value)+'</div>':'')+'</div>'+
   '<table><thead><tr><th>Libellé</th><th class="r">Qté</th><th class="r">Prix unitaire</th><th class="r">Total</th></tr></thead><tbody>'+
   rows.map(r=>'<tr><td>'+nl(r.l)+'</td><td class="r">'+String(r.q).replace('.',',')+'</td><td class="r">'+fmt(r.p)+'</td><td class="r">'+fmt(r.t)+'</td></tr>').join('')+
   '</tbody></table>'+
   '<div class="tt"><div><span>Total HT</span><span>'+money(tot.ht)+'</span></div><div><span>TVA ('+tva+' %)</span><span>'+money(tot.tv)+'</span></div><div class="g"><span>Total TTC</span><span>'+money(tot.ttc)+'</span></div></div>'+
   '<div class="ft">'+($('footer').value.trim()?'<div>'+nl($('footer').value)+'</div>':'')+'</div>';
  fitPreview();
}
function fitPreview(){
  const w = $('pvWrap').clientWidth, k = Math.min(1,w/794), sh = $('sheet');
  sh.style.transform = 'scale('+k+')'; $('pvWrap').style.height = (sh.offsetHeight*k)+'px';
}
window.addEventListener('resize', fitPreview);

const say = t => $('msg').textContent = t;

function buildPdf(){
  const {jsPDF} = window.jspdf, doc = new jsPDF({unit:'mm',format:'a4'});
  const W = 210, H = 297, M = 15, R = W-M, FOOT = 270;
  const rows = getRows(), tot = calc(), C = hex2rgb($('c1').value), SS = hex2rgb($('c2').value), T = hex2rgb($('c3').value), HI = hex2rgb(hiColor($('c1').value));
  const footLines = doc.setFontSize(8).splitTextToSize($('footer').value.trim(), W-2*M);
  const limit = footLines.length ? FOOT - (footLines.length-1)*3.5 - 4 : H-20;
  let y = M;

  // Header: logo + emitter
  if(logo){ const h = 20, w = Math.min(60, h*logo.w/logo.h), hh = w*logo.h/logo.w; doc.addImage(logo.data,'PNG',M,y,w,hh); y += hh+3; }
  doc.setFont('helvetica','normal').setFontSize(9).setTextColor(90);
  const em = doc.splitTextToSize($('emetteur').value.trim(), 90); if($('emetteur').value.trim()){ doc.text(em,M,y+3); y += em.length*4+2; }
  // Title block (right)
  doc.setTextColor(...C).setFont('helvetica','bold').setFontSize(24).text('DEVIS',R,M+8,{align:'right'});
  doc.setTextColor(60).setFont('helvetica','normal').setFontSize(10);
  const d = $('date').value ? new Date($('date').value).toLocaleDateString('fr-FR') : '';
  doc.text('N° '+$('num').value,R,M+15,{align:'right'});
  doc.text('Date : '+d,R,M+20,{align:'right'});
  if(parseInt($('valid').value)) doc.text('Validité : '+$('valid').value+' jours',R,M+25,{align:'right'});
  y = Math.max(y, M+32);

  // Client + objet
  doc.setTextColor(...T).setFont('helvetica','bold').setFontSize(10).text('Client',M,y);
  doc.setFont('helvetica','normal');
  const cl = doc.splitTextToSize($('client').value.trim()||'—', 85); doc.text(cl,M,y+5);
  let y2 = y+5+cl.length*4.5;
  if($('objet').value.trim()){
    doc.setFont('helvetica','bold').text('Objet',105,y); doc.setFont('helvetica','normal');
    const ob = doc.splitTextToSize($('objet').value.trim(), R-105); doc.text(ob,105,y+5); y2 = Math.max(y2,y+5+ob.length*4.5);
  }
  y = y2+8;

  // Table
  const cQ = 125, cP = 158, cT = R;
  const head = () => { doc.setFillColor(...C).rect(M,y,R-M,8,'F'); doc.setTextColor(...HI).setFont('helvetica','bold').setFontSize(9.5);
    doc.text('Libellé',M+2,y+5.3); doc.text('Qté',cQ,y+5.3,{align:'right'}); doc.text('Prix unitaire',cP,y+5.3,{align:'right'}); doc.text('Total',cT-2,y+5.3,{align:'right'}); y += 8; doc.setTextColor(...T).setFont('helvetica','normal'); };
  head();
  rows.forEach((r,i) => {
    const lab = doc.setFontSize(9.5).splitTextToSize(r.l||'', cQ-M-25), h = Math.max(7, lab.length*4.4+3);
    if(y+h > limit){ doc.addPage(); y = M; head(); }
    if(i%2===0){ doc.setFillColor(...SS).rect(M,y,R-M,h,'F'); }
    doc.setTextColor(...T).text(lab,M+2,y+4.8);
    doc.text(String(r.q).replace('.',','),cQ,y+4.8,{align:'right'});
    doc.text(fmt(r.p),cP,y+4.8,{align:'right'});
    doc.text(fmt(r.t),cT-2,y+4.8,{align:'right'});
    y += h;
  });
  doc.setDrawColor(200).line(M,y,R,y); y += 6;

  // Totals
  if(y+28 > limit){ doc.addPage(); y = M; }
  const line = (a,b,bold) => { doc.setFont('helvetica',bold?'bold':'normal').setFontSize(bold?12:10).text(a,125,y); doc.text(b,R-2,y,{align:'right'}); y += bold?7:6; };
  line('Total HT',money(tot.ht));
  line('TVA ('+(parseFloat($('tva').value)||0)+' %)',money(tot.tv));
  doc.setDrawColor(30).line(125,y-3.5,R,y-3.5);
  line('Total TTC',money(tot.ttc),true);

  // Footer on every page
  const n = doc.getNumberOfPages();
  for(let p=1;p<=n;p++){
    doc.setPage(p); doc.setDrawColor(200).line(M,FOOT-footLines.length*0+0-2+ (footLines.length?0:0),R,FOOT-2);
    doc.setFont('helvetica','normal').setFontSize(8).setTextColor(100);
    if(footLines.length) doc.text(footLines,W/2,FOOT+2,{align:'center'});
    doc.text('Page '+p+' / '+n,R,H-8,{align:'right'});
  }
  return doc;
}

$('gen').onclick = async () => {
  try{
    if(!window.jspdf){ say('La bibliothèque PDF n’a pas pu se charger.'); return; }
    if(!getRows().length){ say('Ajoutez au moins une ligne.'); return; }
    const doc = buildPdf();
    const filename = (($('num').value||'devis').replace(/[^\w.-]+/g,'_'))+'.pdf';
    let dl = null;
    try{ if(window.claude && typeof window.claude.use === 'function') dl = await window.claude.use('downloads'); }catch(_){ dl = null; }
    if(dl) await dl.save({filename, data:doc.output('blob')});
    else doc.save(filename); // navigateur classique
    say('PDF prêt.');
  }catch(e){ say(e && e.code==='declined' ? 'Téléchargement annulé.' : 'Erreur : '+(e.message||e)); }
};

// Initialisation (après la définition de toutes les fonctions)
addRow('',1,''); calc();
</script>
</body>
</html>
