#doc table{border-collapse:collapse;width:100%;font:.88rem/1.4 "Segoe UI",system-ui,sans-serif;margin:4px 0 10px;break-inside:avoid}
#doc th,#doc td{border:1px solid var(--stroke-strong);padding:6px 10px;text-align:left}

#doc td.r,#doc th.r{text-align:right}
#doc tr.tot td{font-weight:600;background:none}
#doc .dname{font:600 1.35rem/1.3 "Segoe UI",system-ui,sans-serif;margin:0 0 6px;color:var(--brand);white-space:normal}
#doc .kf{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:16px 0 0;font-family:"Segoe UI",system-ui,sans-serif}
#doc .kf div{border:1px solid var(--stroke);border-top:3px solid var(--brand);border-radius:6px;padding:8px 10px;font-weight:600}
#doc .kf small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
@page doc{size:A4 portrait;margin:14mm}
.note{color:var(--muted);font-size:.85rem;margin-top:18px}
.msg{font-size:.88rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@page{size:A4 portrait;margin:14mm}
@media print{
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 :root{padding:0}

 .wrap{max-width:none;padding:0}

 #doc{page:doc;border:0;box-shadow:none;padding:0;max-width:none;font-size:12px}
}

<body>
<div class="wrap">
<h1>Fiche projet</h1>

<div class="bar">
 <select id="sel" aria-label="Choisir un projet"></select>
 <button class="btn" id="new">Nouveau projet</button>
 <button class="btn warn" id="del">Supprimer</button>
</div>

<div class="head">
 <div class="row">
  <div><label for="pname">Nom du projet</label><input id="pname" placeholder="Ex. : Boulangerie Les Délices"></div>
  <div><label for="pcur">Devise</label><select id="pcur"><option value="FCFA">FCFA</option><option value="$">Dollar ($)</option><option value="€">Euro (€)</option></select></div>
 </div>
 <div class="prog"><b id="ptxt">0 % complété</b><div class="track"><div class="fill" id="pfill"></div></div></div>
</div>

<div id="secs"></div>
<div id="doc" hidden></div>

<div class="bar">
 <button class="btn main" id="print">Imprimer / enregistrer en PDF</button>
 <button class="btn" id="copy">Copier le texte</button>
 <span class="msg" id="msg" role="status"></span>
</div>
<p class="note">Vos réponses sont enregistrées dans ce navigateur, sur cet appareil uniquement. Pour les conserver ailleurs, copiez le texte ou enregistrez la fiche en PDF.</p>
</div>

<script>
var S=[
{t:"Présentation du projet",q:"Qui êtes-vous et que lancez-vous ?",f:[
 {k:"desc",l:"Description du projet",a:1},
 {k:"sect",l:"Secteur d’activité",s:1},
 {k:"lieu",l:"Lieu d’implantation",pl:1},
 {k:"team",l:"Équipe porteuse et rôles",tm:1}]},
{t:"Problèmes et opportunités",q:"Quel besoin non satisfait avez-vous repéré ?",f:[
 {k:"prob",l:"Problème à résoudre",a:1},
 {k:"opp",l:"Opportunité que vous saisissez",a:1}]},
{t:"Marché cible",q:"À qui s’adresse votre offre ?",f:[
 {k:"cli",l:"Profil de vos clients types",pl:1,ph:"Ex. : Étudiants, Commerçants, Familles"},
 {k:"taille",l:"Taille estimée du marché (clients, volume ou valeur)"},
 {k:"ou",l:"Où et comment les atteindre",ch:1}]},
{t:"Produits et services",q:"Que vendez-vous, et à quel prix ?",f:[
 {k:"offre",l:"Offre principale",a:1},
 {k:"prix",l:"Prix de vente"}]},
{t:"Stratégies de croissance",q:"Comment allez-vous grandir ?",f:[
 {k:"acq",l:"Acquisition de clients",a:1},
 {k:"part",l:"Partenariats et canaux de vente",pl:1,ph:"Ex. : Grossiste, Supermarché, Livreur…"},
 {k:"obj",l:"Objectifs à 12 mois",pl:1,ph:"Ex. : 50 clients réguliers, une 2e boutique…"}]},
{t:"Avantages concurrentiels",q:"Pourquoi vous plutôt qu’un autre ?",f:[
 {k:"conc",l:"Principaux concurrents",pl:1,ph:"Ex. : nom d’un concurrent, puis Ajouter"},
 {k:"diff",l:"Ce qui vous distingue",a:1}]},
{t:"Projections financières",q:"Que peut rapporter le projet la première année ?",f:[
 {k:"ca",l:"Chiffre d’affaires prévu (par an)",ct:1,ph:"Ex. : Ventes de produits, Prestations",tl:"Total du chiffre d’affaires",lg:"Chiffre d’affaires total"},
 {k:"ch",l:"Charges prévues (par an)",ct:1,ph:"Ex. : Loyer, Salaires, Électricité",tl:"Total des charges",lg:"Charges totales"}],calc:{id:"c7",l:"Résultat prévu",f:function(d){return sumC(d.ca)-sumC(d.ch)},need:["ca","ch"]}},
{t:"Besoin en financement",q:"De quelle somme avez-vous besoin pour démarrer ?",f:[
 {k:"bes",l:"Besoin total de démarrage",n:1},
 {k:"app",l:"Apport personnel",n:1},
 {k:"use",l:"Utilisation prévue des fonds",ct:1,ph:"Ex. : Équipements, Stock de départ",tl:"Total des fonds utilisés",lg:"Utilisation des fonds"}],calc:{id:"c8",l:"Financement à rechercher",f:function(d){return num(d.bes)-num(d.app)},need:["bes","app"]}}
];
var st={cur:"p1",custom:[],list:[{id:"p1",name:"",cur:"FCFA",d:{}}]};
var SECT=["Agriculture et élevage","Pêche et aquaculture","Agroalimentaire et transformation","Restauration et boulangerie","Commerce de détail","Commerce de gros et import-export","Artisanat","BTP et immobilier","Transport et logistique","Énergie et énergies renouvelables","Santé et pharmacie","Éducation et formation","Numérique et technologies","Télécommunications et mobile money","Tourisme et hôtellerie","Beauté et bien-être","Mode et textile","Médias et communication","Services aux entreprises","Services à la personne","Environnement et recyclage","Culture, arts et loisirs"];
function num(v){var x=parseFloat(String(v==null?"":v).replace(/\s/g,"").replace(",","."));return isNaN(x)?0:x}
function fmt(x){return x.toLocaleString("fr-FR")}
function load(){try{var r=localStorage.getItem("fiche-projets-bp");if(r){var o=JSON.parse(r);if(o&&o.list&&o.list.length){st=o;if(!Array.isArray(st.custom))st.custom=[];if(!Array.isArray(st.canaux))st.canaux=[]}}}catch(e){}}
function save(){try{localStorage.setItem("fiche-projets-bp",JSON.stringify(st))}catch(e){}}
function proj(){for(var i=0;i<st.list.length;i++)if(st.list[i].id===st.cur)return st.list[i];return st.list[0]}
function $(id){return document.getElementById(id)}

function build(){
 var p=proj(),box=$("secs");box.innerHTML="";
 S.forEach(function(s,i){
  var sec=document.createElement("section");sec.className="sec";sec.id="s"+i;
  var num_=document.createElement("div");num_.className="num";num_.textContent=i+1;
  var body=document.createElement("div");
  var h=document.createElement("h2");h.innerHTML='<span class="count" id="n'+i+'"></span>';h.appendChild(document.createTextNode(s.t));
  var q=document.createElement("p");q.className="q";q.textContent=s.q;
  body.appendChild(h);body.appendChild(q);
  s.f.forEach(function(f){
   var w=document.createElement("div");w.className="f";
   var lb=document.createElement("label");lb.textContent=f.l;lb.htmlFor="f_"+f.k;
   if(f.s){w.appendChild(lb);w.appendChild(sectWidget(p,f));body.appendChild(w);return}
   if(f.pl){w.appendChild(lb);w.appendChild(placeWidget(p,f));body.appendChild(w);return}
   if(f.ch){w.appendChild(lb);w.appendChild(chanWidget(p,f));body.appendChild(w);return}
   if(f.tm){w.appendChild(lb);w.appendChild(teamWidget(p,f));body.appendChild(w);return}
   if(f.ct){w.appendChild(lb);w.appendChild(chargeWidget(p,f));body.appendChild(w);return}
   var el=document.createElement(f.a?"textarea":"input");el.id="f_"+f.k;
   if(f.n){el.type="text";el.inputMode="decimal"}
   el.value=p.d[f.k]||"";
   el.addEventListener("input",function(){p.d[f.k]=el.value;save();refresh()});
   w.appendChild(lb);w.appendChild(el);body.appendChild(w);
  });
  if(s.calc){var c=document.createElement("div");c.className="calc";c.id=s.calc.id;body.appendChild(c)}
  sec.appendChild(num_);sec.appendChild(body);box.appendChild(sec);
 });
 $("pname").value=p.name||"";var cs=$("pcur"),cv=p.cur||"FCFA";if(!p.cur)p.cur=cv;if(!Array.prototype.some.call(cs.options,function(o){return o.value===cv})){var o2=document.createElement("option");o2.value=cv;o2.textContent=cv;cs.appendChild(o2)}cs.value=cv;
 refresh();buildDoc();
}

function fillSect(sl,val){
 sl.innerHTML="";
 function opt(par,v,t){var o=document.createElement("option");o.value=v;o.textContent=t||v;par.appendChild(o)}
 opt(sl,"","— Choisir un secteur —");
 var g1=document.createElement("optgroup");g1.label="Secteurs proposés";SECT.forEach(function(x){opt(g1,x)});sl.appendChild(g1);
 if(st.custom.length){var g2=document.createElement("optgroup");g2.label="Mes secteurs";st.custom.forEach(function(x){opt(g2,x)});sl.appendChild(g2)}
 if(val&&SECT.indexOf(val)<0&&st.custom.indexOf(val)<0){var g3=document.createElement("optgroup");g3.label="Saisi précédemment";opt(g3,val);sl.appendChild(g3)}
 sl.value=val||"";
}
function sectWidget(p,f){
 var box=document.createElement("div");
 var sl=document.createElement("select");sl.id="f_"+f.k;sl.className="sectsel";
 var rm=document.createElement("button");rm.type="button";rm.className="btn warn small";rm.textContent="Retirer de ma liste";
 function sync(){rm.hidden=st.custom.indexOf(sl.value)<0}
 fillSect(sl,p.d[f.k]||"");sync();
 sl.addEventListener("change",function(){p.d[f.k]=sl.value;save();refresh();sync()});
 rm.addEventListener("click",function(){
  var v=sl.value;st.custom=st.custom.filter(function(x){return x!==v});
  p.d[f.k]="";save();fillSect(sl,"");sync();refresh();say("Secteur retiré de votre liste.");
 });
 var add=document.createElement("div");add.className="adder";
 var inp=document.createElement("input");inp.id="newsect";inp.placeholder="Votre secteur n’est pas dans la liste ? Ajoutez-le ici";inp.setAttribute("aria-label","Ajouter un secteur d’activité");
 var bt=document.createElement("button");bt.type="button";bt.className="btn";bt.textContent="Ajouter";
 function doAdd(){
  var n=inp.value.trim().replace(/\s+/g," ");if(!n)return;
  var all=SECT.concat(st.custom),hit=null;
  all.forEach(function(x){if(x.toLowerCase()===n.toLowerCase())hit=x});
  if(!hit){st.custom.push(n);hit=n}

function valTxt(v,c){return Array.isArray(v)?v.map(function(x){return typeof x==="object"&&x?(x.r!==undefined?x.n+(x.r?" ("+x.r+")":""):x.n+" ("+fmt(num(x.a))+" "+(c||"")+")"):x}).join(", "):String(v||"").trim()}

 var p=proj(),tot=0,ok=0;
 ["ca","ch","use"].forEach(function(k){var te=$("tot_"+k);if(te)te.textContent=Array.isArray(p.d[k])&&p.d[k].length?te.getAttribute("data-tl")+" : "+fmt(sumC(p.d[k]))+" "+(p.cur||""):""});

  $("n"+i).textContent=n===s.f.length?"✓ complet":n+"/"+s.f.length;
  if(s.calc){
   var shown=s.calc.need.some(function(k){return String(p.d[k]||"").trim()!==""});

  }
 });

function mk(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function dtable(heads,rows,foot,rc){
 var t=mk("table"),th=mk("thead"),hr=mk("tr");
 heads.forEach(function(h,i){var c=mk("th",rc.indexOf(i)>=0?"r":"",h);hr.appendChild(c)});
 th.appendChild(hr);t.appendChild(th);var tb=mk("tbody");
 rows.forEach(function(r){var tr=mk("tr");r.forEach(function(x,i){tr.appendChild(mk("td",rc.indexOf(i)>=0?"r":"",x))});tb.appendChild(tr)});
 if(foot){var tr=mk("tr","tot");foot.forEach(function(x,i){tr.appendChild(mk("td",rc.indexOf(i)>=0?"r":"",x))});tb.appendChild(tr)}

function buildDoc(){
 var p=proj(),d=p.d,cur=p.cur||"",box=$("doc");box.innerHTML="";
 box.appendChild(mk("h1","","Business plan"));
 if(p.name&&p.name.trim())box.appendChild(mk("p","dname",p.name.trim()));
 var sub=[(typeof d.sect==="string"?d.sect:""),valTxt(d.lieu)].filter(function(x){return x&&String(x).trim()}).join(" · ");
 if(sub)box.appendChild(mk("p","dsub",sub));

 var ca=sumC(d.ca),ch=sumC(d.ch),bes=num(d.bes),app=num(d.app);
 if(ca||ch||bes||app){
  var kf=mk("div","kf");
  [["Chiffre d’affaires prévu",ca],["Charges prévues",ch],["Résultat prévu",ca-ch],["Besoin de démarrage",bes],["Apport personnel",app],["Financement à rechercher",bes-app]].forEach(function(o){
   var c=mk("div");c.appendChild(mk("small","",o[0]));c.appendChild(document.createTextNode(fmt(o[1])+" "+cur));kf.appendChild(c);
  });
  box.appendChild(kf);
 }
 S.forEach(function(s,i){
  box.appendChild(mk("h2","",(i+1)+". "+s.t));
  s.f.forEach(function(f){
   box.appendChild(mk("h3","",f.l));
   var v=d[f.k];
   if(Array.isArray(v)){
    if(!v.length){box.appendChild(mk("p","todo","À compléter"));return}
    if(typeof v[0]==="object"){
     if(v[0].r!==undefined){var ul=mk("ul");v.forEach(function(x){ul.appendChild(mk("li","",x.n+(x.r?" ("+x.r+")":"")))});box.appendChild(ul)}
     else{box.appendChild(dtable(["Poste","Montant ("+cur+")"],v.map(function(x){return[x.n,fmt(num(x.a))]}),["Total",fmt(sumC(v))],[1]))}
    }else{var ul2=mk("ul");v.forEach(function(x){ul2.appendChild(mk("li","",x))});box.appendChild(ul2)}
   }else{
    var t=String(v||"").trim();
    if(!t)box.appendChild(mk("p","todo","À compléter"));
    else box.appendChild(mk("p","",f.n?fmt(num(t))+" "+cur:t));
   }
  });
  if(s.calc)box.appendChild(mk("p","dres",s.calc.l+" : "+fmt(s.calc.f(d))+" "+cur));
 });
 
}
function toText(){
